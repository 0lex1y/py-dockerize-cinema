version: "3"

services:

  app:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./:/app
    ports: ["8000:8000"]
    command: >
      sh -c "
      python wait_for_db.py &&
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  db:
    image: postgres:14-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - my_db:/var/lib/postgresql/data

volumes:
  my_db:
